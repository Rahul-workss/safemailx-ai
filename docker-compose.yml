services:
  trustmail-api:
    build: .
    command: uvicorn server.app:app --host 0.0.0.0 --port 8080
    restart: always
    env_file: .env
    environment:
      DATABASE_URL: postgresql://trustmail:trustmail@postgres:5432/trustmail
      REDIS_URL: redis://redis:6379/0
      LLM_BASE_URL: http://trustmail-llm:8000/v1/chat/completions
      LLM_PROVIDER: vllm
    volumes:
      - ./reports:/app/reports
      - ./models:/app/models
      - ./src/credentials.json:/app/src/credentials.json:ro
      - ./src/token.pickle:/app/src/token.pickle
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis

  trustmail-worker:
    build: .
    command: python -m server.worker
    restart: always
    env_file: .env
    environment:
      DATABASE_URL: postgresql://trustmail:trustmail@postgres:5432/trustmail
      REDIS_URL: redis://redis:6379/0
      LLM_BASE_URL: http://trustmail-llm:8000/v1/chat/completions
      LLM_PROVIDER: vllm
    volumes:
      - ./reports:/app/reports
      - ./models:/app/models
      - ./src/credentials.json:/app/src/credentials.json:ro
      - ./src/token.pickle:/app/src/token.pickle
    depends_on:
      - postgres
      - redis

  trustmail-gmail-watcher:
    build: .
    command: python -m server.gmail_watcher
    restart: always
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./src/credentials.json:/app/src/credentials.json:ro
      - ./src/token.pickle:/app/src/token.pickle
    depends_on:
      - redis

  trustmail-llm:
    image: vllm/vllm-openai:latest
    restart: always
    environment:
      MODEL_NAME: Qwen/Qwen2.5-7B-Instruct
    command: >
      --model Qwen/Qwen2.5-7B-Instruct
      --served-model-name qwen2.5-7b-instruct
      --host 0.0.0.0
      --port 8000
      --max-model-len 8192
    volumes:
      - trustmail-model-cache:/root/.cache/huggingface
    ports:
      - "8000:8000"

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: trustmail
      POSTGRES_USER: trustmail
      POSTGRES_PASSWORD: trustmail
    volumes:
      - postgres-data:/var/lib/postgresql/data

  nginx:
    image: nginx:1.27-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-web:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
    depends_on:
      - trustmail-api

  certbot:
    image: certbot/certbot:latest
    profiles: ["https"]
    volumes:
      - certbot-web:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
    entrypoint: /bin/sh
    command: -c "echo 'Run certbot manually with your domain, then switch nginx to deploy/nginx.https.conf.template values.'"

volumes:
  redis-data:
  postgres-data:
  trustmail-model-cache:
  certbot-web:
  certbot-certs:
