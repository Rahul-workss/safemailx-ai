services:
  trustmail-api:
    build: .
    command: uvicorn server.app:app --host 0.0.0.0 --port 8080 --reload
    restart: always
    env_file: .env
    environment:
      DATABASE_URL: postgresql://trustmail:trustmail@postgres:5432/trustmail
      REDIS_URL: redis://redis:6379/0
      LLM_BASE_URL: http://host.docker.internal:1234/v1/chat/completions
      LLM_PROVIDER: openai
      TESSERACT_CMD: tesseract
    volumes:
      - ./src:/app/src
      - ./reports:/app/reports
      - ./models:/app/models
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis

  trustmail-worker:
    build: .
    command: python -m server.worker
    restart: always
    env_file: .env
    environment:
      DATABASE_URL: postgresql://trustmail:trustmail@postgres:5432/trustmail
      REDIS_URL: redis://redis:6379/0
      LLM_BASE_URL: http://host.docker.internal:1234/v1/chat/completions
      LLM_PROVIDER: openai
      TESSERACT_CMD: tesseract
    volumes:
      - ./src:/app/src
      - ./reports:/app/reports
      - ./models:/app/models
    depends_on:
      - postgres
      - redis

  trustmail-gmail-watcher:
    build: .
    command: python -m server.gmail_watcher
    restart: always
    env_file: .env
    environment:
      DATABASE_URL: postgresql://trustmail:trustmail@postgres:5432/trustmail
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./src:/app/src
    depends_on:
      - postgres
      - redis

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: trustmail
      POSTGRES_USER: trustmail
      POSTGRES_PASSWORD: trustmail
    ports:
      - "5432:5432"        # exposed so local dev processes can connect
    volumes:
      - postgres-data:/var/lib/postgresql/data

  nginx:
    image: nginx:1.27-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-web:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
    depends_on:
      - trustmail-api

  certbot:
    image: certbot/certbot:latest
    profiles: ["https"]
    volumes:
      - certbot-web:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
    entrypoint: /bin/sh
    command: -c "echo 'Run certbot manually with your domain, then switch nginx to deploy/nginx.https.conf.template values.'"

volumes:
  redis-data:
  postgres-data:
  trustmail-model-cache:
  certbot-web:
  certbot-certs:
