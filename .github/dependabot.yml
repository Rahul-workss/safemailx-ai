version: 2
updates:
  # Maintain dependencies for the Node.js/JavaScript frontend
  - package-ecosystem: "npm"
    directory: "/safemailx-website"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # Maintain dependencies for the Python backend/scripts
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # Keep GitHub Actions up to date
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
