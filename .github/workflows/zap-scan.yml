name: OWASP ZAP Security Scan

on:
  schedule:
    - cron: '0 0 * * 0' # Run automatically every Sunday at midnight
  workflow_dispatch: # Allows you to manually trigger the scan from the GitHub UI

jobs:
  zap_scan:
    runs-on: ubuntu-latest
    name: Scan live website
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'https://safemailx-ai.tech/'
          # Fails the GitHub action if severe vulnerabilities are found
          fail_action: false
          # Uploads the HTML report directly to GitHub artifacts
          allow_issue_writing: false
