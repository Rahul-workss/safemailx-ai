name: Build Dev APK (Hot Reload)

on:
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild even if no native changes'
        required: false
        default: 'false'

jobs:
  build:
    name: Build Dev APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trustmail-mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Generate Native Android Project (Prebuild)
        run: npx expo prebuild --platform android --no-install

      - name: Restore stable debug keystore (fixes Google Sign-In SHA-1)
        run: |
          echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 --decode > android/app/debug.keystore

      - name: Enable AndroidX and Jetifier
        run: |
          PROPERTIES_FILE="android/gradle.properties"
          touch "$PROPERTIES_FILE"

          grep -q '^android.useAndroidX=' "$PROPERTIES_FILE" \
            || echo 'android.useAndroidX=true' >> "$PROPERTIES_FILE"

          grep -q '^android.enableJetifier=' "$PROPERTIES_FILE" \
            || echo 'android.enableJetifier=true' >> "$PROPERTIES_FILE"

      - name: Patch Gradle repos (ensure mavenCentral for plugins)
        run: |
          # Add mavenCentral to pluginManagement repositories if missing
          SETTINGS_FILE="android/settings.gradle"
          if [ -f "$SETTINGS_FILE" ] && ! grep -q "mavenCentral()" "$SETTINGS_FILE"; then
            sed -i '/pluginManagement {/,/repositories {/ {
              /repositories {/a\        mavenCentral()
            }' "$SETTINGS_FILE"
          fi
          # Also create a Gradle init script as fallback
          mkdir -p ~/.gradle
          cat > ~/.gradle/init.gradle << 'EOF'
          allprojects {
            buildscript {
              repositories {
                mavenCentral()
                google()
                gradlePluginPortal()
              }
            }
            repositories {
              mavenCentral()
              google()
            }
          }
          settingsEvaluated { settings ->
            settings.pluginManagement {
              repositories {
                mavenCentral()
                google()
                gradlePluginPortal()
              }
            }
          }
          EOF

      - name: Build Debug APK (Dev Client)
        working-directory: trustmail-mobile/android
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError"
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            --init-script ~/.gradle/init.gradle \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/trustmail-mobile/android/app/debug.keystore \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=androiddebugkey \
            -Pandroid.injected.signing.key.password=android

      - name: Upload Dev APK
        uses: actions/upload-artifact@v4
        with:
          name: safemailx-dev-build
          path: trustmail-mobile/android/app/build/outputs/apk/debug/app-debug.apk
