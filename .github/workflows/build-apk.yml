name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'trustmail-mobile/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trustmail-mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: trustmail-mobile/package-lock.json

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      # ── Install JS dependencies ────────────────────────────────────────
      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # ── Generate native Android project ───────────────────────────────
      - name: Generate Native Android Project (Prebuild)
        run: npx expo prebuild --platform android --no-install

      # ── Stable debug keystore for consistent Google Sign-In SHA-1 ─────
      - name: Restore stable debug keystore
        run: |
          echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 --decode > android/app/debug.keystore

      # ── Harden gradle.properties (all known stability flags) ──────────
      - name: Harden gradle.properties
        run: |
          PROPS="android/gradle.properties"
          touch "$PROPS"

          # AndroidX
          grep -q '^android.useAndroidX='          "$PROPS" || echo 'android.useAndroidX=true'          >> "$PROPS"
          grep -q '^android.enableJetifier='       "$PROPS" || echo 'android.enableJetifier=true'       >> "$PROPS"

          # Disable release linting (prevents bundleReleaseLocalLintAar crash)
          grep -q '^android.lint.checkReleaseBuilds' "$PROPS" || echo 'android.lint.checkReleaseBuilds=false' >> "$PROPS"
          grep -q '^android.lint.abortOnError'     "$PROPS" || echo 'android.lint.abortOnError=false'   >> "$PROPS"

          # Disable parallel Gradle execution (prevents file-access.bin race condition)
          grep -q '^org.gradle.parallel='          "$PROPS" || echo 'org.gradle.parallel=false'         >> "$PROPS"

          # Disable Gradle daemon in CI (prevents stale state)
          grep -q '^org.gradle.daemon='            "$PROPS" || echo 'org.gradle.daemon=false'           >> "$PROPS"

          # Disable configuration cache (can cause serialisation errors in CI)
          grep -q '^org.gradle.configuration-cache' "$PROPS" || echo 'org.gradle.configuration-cache=false' >> "$PROPS"

          # Disable configure-on-demand (incompatible with some RN setups)
          grep -q '^org.gradle.configureondemand=' "$PROPS" || echo 'org.gradle.configureondemand=false' >> "$PROPS"

      # ── Cache Gradle dependencies for faster future builds ─────────────
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('trustmail-mobile/android/gradle/wrapper/gradle-wrapper.properties') }}-${{ hashFiles('trustmail-mobile/**/*.gradle*', 'trustmail-mobile/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # ── Patch repos and inject init script ────────────────────────────
      - name: Patch Gradle repos
        run: |
          SETTINGS_FILE="android/settings.gradle"
          if [ -f "$SETTINGS_FILE" ] && ! grep -q "mavenCentral()" "$SETTINGS_FILE"; then
            sed -i '/pluginManagement {/,/repositories {/ {
              /repositories {/a\        mavenCentral()
            }' "$SETTINGS_FILE"
          fi
          mkdir -p ~/.gradle
          cat > ~/.gradle/init.gradle << 'INIT_EOF'
          allprojects {
            buildscript {
              repositories {
                mavenCentral()
                google()
                gradlePluginPortal()
              }
            }
            repositories {
              mavenCentral()
              google()
            }
            tasks.configureEach { task ->
              if (task.name.toLowerCase().contains("lint")) {
                task.enabled = false
              }
            }
          }
          settingsEvaluated { settings ->
            settings.pluginManagement {
              repositories {
                mavenCentral()
                google()
                gradlePluginPortal()
              }
            }
          }
          INIT_EOF

      # ── Build release APK ──────────────────────────────────────────────
      - name: Build Release APK
        working-directory: trustmail-mobile/android
        env:
          GRADLE_OPTS: >-
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError"
            -Dorg.gradle.parallel=false
            -Dorg.gradle.daemon=false
        run: |
          ./gradlew assembleRelease \
            --no-daemon \
            --no-build-cache \
            --no-parallel \
            --max-workers=2 \
            --init-script ~/.gradle/init.gradle \
            -x lint \
            -x lintVital \
            -x lintVitalRelease \
            -x lintRelease \
            -x test \
            -x testRelease \
            -x bundleReleaseLocalLintAar \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/trustmail-mobile/android/app/debug.keystore \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=androiddebugkey \
            -Pandroid.injected.signing.key.password=android

      # ── Upload artifact ────────────────────────────────────────────────
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: safemailx-user-apk-v1.0.6-run${{ github.run_number }}
          path: trustmail-mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
