name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'trustmail-mobile/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    name: Build Standalone User APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trustmail-mobile

    steps:
      # ── 1. Checkout repository ──────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Free Disk Space on Runner (prevents "No space left on device") ─
      - name: Free Disk Space
        run: |
          echo "=== Disk space before reclamation ==="
          df -h
          # Remove unused large runtimes preinstalled on GitHub Actions runners
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf "$AGENT_TOOLSDIRECTORY" || true
          # Keep only the target NDK (27.1.12297006), remove other NDK versions if present
          if [ -d "/usr/local/lib/android/sdk/ndk" ]; then
            for d in /usr/local/lib/android/sdk/ndk/* ; do
              if [ -d "$d" ] && [[ "$d" != *"27.1.12297006"* ]]; then
                echo "Removing unneeded NDK: $d"
                sudo rm -rf "$d" || true
              fi
            done
          fi
          echo "=== Disk space after reclamation ==="
          df -h

      # ── 3. Node.js setup ────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ── 4. Java 21 setup ────────────────────────────────────────────────
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      # ── 5. Install JS dependencies ──────────────────────────────────────
      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # ── 6. Generate Native Android Project (Expo Prebuild) ──────────────
      - name: Generate Native Android Project
        run: npx expo prebuild --platform android --no-install

      # ── 7. Restore stable keystore for Google Sign-In ───────────────────
      - name: Restore stable debug keystore
        run: |
          echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 --decode > android/app/debug.keystore

      # ── 8. Harden gradle.properties ─────────────────────────────────────
      - name: Harden gradle.properties
        run: |
          PROPS="android/gradle.properties"
          touch "$PROPS"

          # 1. Target physical Android phones (cuts C++ compile time and disk by 75%)
          grep -q '^reactNativeArchitectures=' "$PROPS" \
            || echo 'reactNativeArchitectures=arm64-v8a,armeabi-v7a' >> "$PROPS"

          # 2. AndroidX & Jetifier
          grep -q '^android.useAndroidX=' "$PROPS" \
            || echo 'android.useAndroidX=true' >> "$PROPS"
          grep -q '^android.enableJetifier=' "$PROPS" \
            || echo 'android.enableJetifier=true' >> "$PROPS"

          # 3. Disable release linting (prevents bundleReleaseLocalLintAar crash)
          grep -q '^android.lint.checkReleaseBuilds' "$PROPS" \
            || echo 'android.lint.checkReleaseBuilds=false' >> "$PROPS"
          grep -q '^android.lint.abortOnError' "$PROPS" \
            || echo 'android.lint.abortOnError=false' >> "$PROPS"

          # 4. Disable parallelism to prevent file-access.bin race corruption
          grep -q '^org.gradle.parallel=' "$PROPS" \
            || echo 'org.gradle.parallel=false' >> "$PROPS"
          grep -q '^org.gradle.daemon=' "$PROPS" \
            || echo 'org.gradle.daemon=false' >> "$PROPS"
          grep -q '^org.gradle.configureondemand=' "$PROPS" \
            || echo 'org.gradle.configureondemand=false' >> "$PROPS"
          grep -q '^org.gradle.configuration-cache=' "$PROPS" \
            || echo 'org.gradle.configuration-cache=false' >> "$PROPS"

      # ── 9. Inject Gradle repositories and afterEvaluate lint disabler ────
      - name: Inject Gradle init script
        run: |
          SETTINGS_FILE="android/settings.gradle"
          if [ -f "$SETTINGS_FILE" ] && ! grep -q "mavenCentral()" "$SETTINGS_FILE"; then
            sed -i '/pluginManagement {/,/repositories {/ {
              /repositories {/a\        mavenCentral()
            }' "$SETTINGS_FILE"
          fi

          mkdir -p ~/.gradle
          cat > ~/.gradle/init.gradle << 'INIT_EOF'
          allprojects {
            buildscript {
              repositories {
                mavenCentral()
                google()
                gradlePluginPortal()
              }
            }
            repositories {
              mavenCentral()
              google()
            }
            afterEvaluate { project ->
              project.tasks.matching { task ->
                task.name.toLowerCase().contains("lint")
              }.configureEach { task ->
                task.enabled = false
              }
            }
          }
          settingsEvaluated { settings ->
            settings.pluginManagement {
              repositories {
                mavenCentral()
                google()
                gradlePluginPortal()
              }
            }
          }
          INIT_EOF

      # ── 10. Build Standalone Release APK ────────────────────────────────
      - name: Build Standalone Release APK
        working-directory: trustmail-mobile/android
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dorg.gradle.parallel=false -Dorg.gradle.daemon=false"
        run: |
          ./gradlew assembleRelease \
            --no-daemon \
            --no-build-cache \
            --no-parallel \
            --max-workers=2 \
            --init-script ~/.gradle/init.gradle \
            -x test \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/trustmail-mobile/android/app/debug.keystore \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=androiddebugkey \
            -Pandroid.injected.signing.key.password=android

      # ── 11. Upload Release APK Artifact ─────────────────────────────────
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: safemailx-user-apk-v1.0.6-run${{ github.run_number }}
          path: trustmail-mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
