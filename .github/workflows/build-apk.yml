name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'trustmail-mobile/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    name: Build Standalone User APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trustmail-mobile

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. AGGRESSIVE disk cleanup (~50 GB freed) ────────────────────────
      # GitHub hosted runners have ~14 GB free by default.
      # react-native-reanimated C++ compilation needs ~10 GB+.
      # This step removes unused large blobs that GitHub pre-installs.
      - name: Free Disk Space
        run: |
          echo "=== Disk BEFORE cleanup ==="
          df -h
          # Unused language runtimes and toolchains (frees ~45 GB)
          sudo rm -rf /usr/share/dotnet          || true
          sudo rm -rf /usr/local/share/boost     || true
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"    || true
          sudo rm -rf /opt/ghc                   || true
          # Android SDK parts not needed for compilation (frees ~12 GB)
          sudo rm -rf /usr/local/lib/android/sdk/emulator        || true
          sudo rm -rf /usr/local/lib/android/sdk/system-images   || true
          sudo rm -rf /usr/local/lib/android/sdk/sources         || true
          # Keep only the target NDK (27.1.12297006), remove other NDK versions if present
          if [ -d "/usr/local/lib/android/sdk/ndk" ]; then
            for d in /usr/local/lib/android/sdk/ndk/*; do
              [[ "$d" == *"27.1.12297006"* ]] || sudo rm -rf "$d" || true
            done
          fi
          echo "=== Disk AFTER cleanup ==="
          df -h

      # ── 3. Node.js ───────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # ── 4. Java 21 ───────────────────────────────────────────────────────
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      # ── 5. JS dependencies ───────────────────────────────────────────────
      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # ── 6. Expo Prebuild ─────────────────────────────────────────────────
      - name: Generate Native Android Project
        run: npx expo prebuild --platform android --no-install

      # ── 7. Keystore ──────────────────────────────────────────────────────
      - name: Restore stable debug keystore
        run: |
          echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 --decode > android/app/debug.keystore

      # ── 8. CRITICAL: Inject abiFilters into generated build.gradle ───────
      # expo prebuild generates android/app/build.gradle fresh every time.
      # The Expo template does NOT read reactNativeArchitectures from
      # gradle.properties, so that property has zero effect.
      # The ONLY reliable fix is to sed-inject ndk.abiFilters directly into
      # defaultConfig in the generated build.gradle AFTER prebuild runs.
      # arm64-v8a covers 100% of phones from 2015+.
      # This cascades to ALL C++ libs (Reanimated, Worklets, etc.) and
      # reduces native compilation disk usage by ~75%.
      - name: Restrict native ABIs to arm64-v8a only
        run: |
          # Inject "ndk { abiFilters 'arm64-v8a' }" inside defaultConfig block
          sed -i '/defaultConfig {/a\        ndk { abiFilters "arm64-v8a" }' android/app/build.gradle
          echo "=== Verifying abiFilters injection ==="
          grep -A 6 "defaultConfig {" android/app/build.gradle | head -8
          echo "=== Disk space before Gradle build ==="
          df -h

      # ── 9. Harden gradle.properties ──────────────────────────────────────
      - name: Harden gradle.properties
        run: |
          PROPS="android/gradle.properties"
          touch "$PROPS"
          # Lint suppression
          grep -q '^android.useAndroidX='             "$PROPS" || echo 'android.useAndroidX=true'              >> "$PROPS"
          grep -q '^android.enableJetifier='          "$PROPS" || echo 'android.enableJetifier=true'           >> "$PROPS"
          grep -q '^android.lint.checkReleaseBuilds'  "$PROPS" || echo 'android.lint.checkReleaseBuilds=false' >> "$PROPS"
          grep -q '^android.lint.abortOnError'        "$PROPS" || echo 'android.lint.abortOnError=false'       >> "$PROPS"
          # Parallelism: disabled to prevent file-access.bin race
          grep -q '^org.gradle.parallel='             "$PROPS" || echo 'org.gradle.parallel=false'             >> "$PROPS"
          grep -q '^org.gradle.daemon='               "$PROPS" || echo 'org.gradle.daemon=false'               >> "$PROPS"
          grep -q '^org.gradle.configureondemand='    "$PROPS" || echo 'org.gradle.configureondemand=false'    >> "$PROPS"
          grep -q '^org.gradle.configuration-cache='  "$PROPS" || echo 'org.gradle.configuration-cache=false'  >> "$PROPS"

      # ── 10. Gradle init script ───────────────────────────────────────────
      - name: Inject Gradle init script
        run: |
          SETTINGS_FILE="android/settings.gradle"
          if [ -f "$SETTINGS_FILE" ] && ! grep -q "mavenCentral()" "$SETTINGS_FILE"; then
            sed -i '/pluginManagement {/,/repositories {/ {
              /repositories {/a\        mavenCentral()
            }' "$SETTINGS_FILE"
          fi
          mkdir -p ~/.gradle
          cat > ~/.gradle/init.gradle << 'INIT_EOF'
          allprojects {
            buildscript {
              repositories {
                mavenCentral()
                google()
                gradlePluginPortal()
              }
            }
            repositories {
              mavenCentral()
              google()
            }
            afterEvaluate { project ->
              project.tasks.matching { task ->
                task.name.toLowerCase().contains("lint")
              }.configureEach { task ->
                task.enabled = false
              }
            }
          }
          settingsEvaluated { settings ->
            settings.pluginManagement {
              repositories {
                mavenCentral()
                google()
                gradlePluginPortal()
              }
            }
          }
          INIT_EOF

      # ── 11. Build Release APK ─────────────────────────────────────────────
      - name: Build Standalone Release APK
        working-directory: trustmail-mobile/android
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -Dorg.gradle.parallel=false -Dorg.gradle.daemon=false"
        run: |
          ./gradlew assembleRelease \
            --no-daemon \
            --no-build-cache \
            --no-parallel \
            --max-workers=2 \
            --init-script ~/.gradle/init.gradle \
            -x test \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/trustmail-mobile/android/app/debug.keystore \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=androiddebugkey \
            -Pandroid.injected.signing.key.password=android

      # ── 12. Upload APK ───────────────────────────────────────────────────
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: safemailx-user-apk-v1.0.7-run${{ github.run_number }}
          path: trustmail-mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
